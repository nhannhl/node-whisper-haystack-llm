services:
  # llama.cpp engine for local LLM inference
  llama:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: llama
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
    command:
      - "--model"
      - "/models/Qwen_Qwen3-4B-Instruct-2507-Q6_K_L.gguf"
      - "--port"
      - "8080"
      - "--host"
      - "0.0.0.0"
      - "--ctx-size"
      - "4096"
      - "--threads"
      - "6"
      - "--parallel"
      - "1"
      - "--batch-size"
      - "64"
    networks:
      - app_net

  # whisper-cpp engine for ASR
  whisper:
    image: onerahmet/openai-whisper-asr-webservice@sha256:03b402335881cdab2e4939b24620809df8d6ceec3bf2712217d41c8761a0f5d4
    container_name: whisper
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - ASR_ENGINE=whisper-cpp
      - ASR_MODEL=base-q8_1
    networks:
      - app_net

  faster-whisper:
    image: onerahmet/openai-whisper-asr-webservice@sha256:03b402335881cdab2e4939b24620809df8d6ceec3bf2712217d41c8761a0f5d4
    container_name: faster-whisper
    restart: unless-stopped
    ports:
      - "9001:9000"
    environment:
      - ASR_ENGINE=faster_whisper
      - ASR_MODEL=base
      - ASR_DEVICE=cpu
      - ASR_QUANTIZATION=int8
    networks:
      - app_net

  whisper-x:
    image: onerahmet/openai-whisper-asr-webservice@sha256:03b402335881cdab2e4939b24620809df8d6ceec3bf2712217d41c8761a0f5d4
    container_name: whisper-x
    restart: unless-stopped
    ports:
      - "9002:9000"
    environment:
      - ASR_ENGINE=whisperx
      - ASR_MODEL=base
      - ASR_DEVICE=cpu
      - ASR_QUANTIZATION=int8
      - HF_TOKEN=${HF_TOKEN}
    networks:
      - app_net

  # Qdrant vector database
  vectordb:
    image: qdrant/qdrant:latest
    container_name: vectordb
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    networks:
      - app_net

  # Huggingface embeddings service
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: embeddings
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - MODEL_ID=BAAI/bge-base-en-v1.5
      - NUM_THREADS=6
    volumes:
      - ./hf_models:/data
    networks:
      - app_net

  # API server
  api:
    build: ./api
    container_name: api
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - llama
      # - whisper
      - vectordb
      - embeddings
      # - faster-whisper
      - whisper-x
    volumes:
      - ./api:/app
      - /app/node_modules
    env_file:
      - ./api/.env
    command: [ "npm", "run", "dev" ]
    networks:
      - app_net

  # Frontend server
  front:
    build: ./front
    container_name: front
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./front:/app
      - /app/node_modules
    env_file:
      - ./front/.env
    command: [ "npm", "run", "dev", "--", "--host", "0.0.0.0" ]
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
