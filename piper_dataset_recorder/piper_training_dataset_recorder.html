<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piper Training Dataset Recorder</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2em;
        }

        .progress {
            text-align: center;
            margin-bottom: 20px;
            color: #666;
            font-size: 1.1em;
        }

        .sentence-display {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 30px;
            margin: 30px 0;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3em;
            line-height: 1.6;
            color: #333;
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        button {
            padding: 15px 30px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            min-width: 120px;
        }

        .record-btn {
            background: #dc3545;
            color: white;
        }

        .record-btn:hover:not(:disabled) {
            background: #c82333;
            transform: scale(1.05);
        }

        .record-btn.recording {
            background: #ff4757;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .stop-btn {
            background: #6c757d;
            color: white;
        }

        .stop-btn:hover:not(:disabled) {
            background: #5a6268;
            transform: scale(1.05);
        }

        .next-btn {
            background: #28a745;
            color: white;
        }

        .next-btn:hover:not(:disabled) {
            background: #218838;
            transform: scale(1.05);
        }

        .download-btn {
            background: #007bff;
            color: white;
        }

        .download-btn:hover:not(:disabled) {
            background: #0056b3;
            transform: scale(1.05);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .recordings-list {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e9ecef;
        }

        .recordings-list h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .recording-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .recording-info {
            flex: 1;
        }

        .recording-name {
            font-weight: 600;
            color: #333;
        }

        .recording-sentence {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .recording-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            padding: 8px 15px;
            font-size: 0.9em;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
            min-width: 80px;
        }

        .play-btn {
            background: #17a2b8;
            color: white;
        }

        .play-btn:hover:not(:disabled) {
            background: #138496;
            transform: scale(1.05);
        }

        .play-btn.playing {
            background: #ffc107;
            color: #333;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
        }

        .delete-btn:hover:not(:disabled) {
            background: #c82333;
            transform: scale(1.05);
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            text-align: center;
            margin: 20px 0;
            font-weight: 600;
            font-size: 1.1em;
        }

        .status.recording {
            color: #dc3545;
        }

        .status.ready {
            color: #28a745;
        }

        .status.idle {
            color: #6c757d;
        }

        .save-indicator {
            text-align: center;
            font-size: 0.85em;
            color: #28a745;
            margin-top: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .save-indicator.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Piper Training Dataset Recorder</h1>
        
        <div class="progress">

        <div class="sentence-display" id="sentence-display">

        <div class="save-indicator" id="save-indicator">💾 Progress saved</div>

            <button id="download-btn" class="download-btn" disabled>📥 Download All</button>

        <div class="recordings-list" id="recordings-list" style="display: none;">
            <h2>Recordings</h2>
            <div id="recordings-container"></div>
        </div>
    </div>

        // Convert blob to base64 for storage
        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    const base64 = reader.result.split(',')[1];
                    resolve(base64);
                };
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }
        
        // Convert base64 back to blob
        function base64ToBlob(base64, mimeType) {
            const byteCharacters = atob(base64);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            return new Blob([byteArray], { type: mimeType });
        }
        
        // Save recordings to localStorage
        async function saveToLocalStorage() {
            try {
                const recordingsData = await Promise.all(recordings.map(async (rec) => ({
                    fileName: rec.fileName,
                    sentence: rec.sentence,
                    sentenceIndex: rec.sentenceIndex,
                    blobBase64: await blobToBase64(rec.blob)
                })));
                
                localStorage.setItem(STORAGE_KEY, JSON.stringify(recordingsData));
                localStorage.setItem(STORAGE_INDEX_KEY, currentIndex.toString());
                
                // Show save indicator
                const saveIndicator = document.getElementById('save-indicator');
                saveIndicator.classList.add('show');
                setTimeout(() => {
                    saveIndicator.classList.remove('show');
                }, 2000);
            } catch (error) {
                console.error('Error saving to localStorage:', error);
            }
        }
        
        // Load recordings from localStorage
        function loadFromLocalStorage() {
            try {
                const savedRecordings = localStorage.getItem(STORAGE_KEY);
                const savedIndex = localStorage.getItem(STORAGE_INDEX_KEY);
                
                if (savedRecordings) {
                    const recordingsData = JSON.parse(savedRecordings);
                    recordings = recordingsData.map(rec => ({
                        fileName: rec.fileName,
                        sentence: rec.sentence,
                        sentenceIndex: rec.sentenceIndex,
                        blob: base64ToBlob(rec.blobBase64, 'audio/wav')
                    }));
                    
                    if (recordings.length > 0) {
                        updateRecordingsList();
                        downloadBtn.disabled = false;
                    }
                }
                
                if (savedIndex !== null) {
                    currentIndex = parseInt(savedIndex, 10);
                    // Make sure we don't go beyond the sentences array
                    if (currentIndex >= sentences.length) {
                        currentIndex = sentences.length - 1;
                    }
                }
            } catch (error) {
                console.error('Error loading from localStorage:', error);
            }
        }
        
        // Clear localStorage (for testing/reset)
        function clearLocalStorage() {
            localStorage.removeItem(STORAGE_KEY);
            localStorage.removeItem(STORAGE_INDEX_KEY);
        }

        const sentenceDisplay = document.getElementById('sentence-display');
        const currentIndexSpan = document.getElementById('current-index');
        const totalSentencesSpan = document.getElementById('total-sentences');
        const recordBtn = document.getElementById('record-btn');
        const stopBtn = document.getElementById('stop-btn');
        const nextBtn = document.getElementById('next-btn');
        const downloadBtn = document.getElementById('download-btn');
        const statusDiv = document.getElementById('status');
        const recordingsList = document.getElementById('recordings-list');
        const recordingsContainer = document.getElementById('recordings-container');

        totalSentencesSpan.textContent = sentences.length;

        function updateSentence() {
            sentenceDisplay.textContent = sentences[currentIndex];
            currentIndexSpan.textContent = currentIndex + 1;
        }

        function updateStatus(text, className) {
            statusDiv.textContent = text;
            statusDiv.className = `status ${className}`;
        }

        function floatTo16BitPCM(output, offset, input) {
            for (let i = 0; i < input.length; i++, offset += 2) {
                let s = Math.max(-1, Math.min(1, input[i]));
                output.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        function encodeWAV(samples, sampleRate) {
            let buffer = new ArrayBuffer(44 + samples.length * 2);
            let view = new DataView(buffer);
            
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + samples.length * 2, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(view, 36, 'data');
            view.setUint32(40, samples.length * 2, true);
            floatTo16BitPCM(view, 44, samples);
            
            return buffer;
        }

        async function startRecording() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                isRecording = true;
                
                // Use MediaRecorder API (modern, non-deprecated)
                // Try to find a supported mime type
                let options = {};
                const mimeTypes = ['audio/webm', 'audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/mp4', 'audio/wav'];
                for (const mimeType of mimeTypes) {
                    if (MediaRecorder.isTypeSupported(mimeType)) {
                        options.mimeType = mimeType;
                        break;
                    }
                }
                
                mediaRecorder = new MediaRecorder(stream, options);
                
                mediaRecorder.ondataavailable = function(event) {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };
                
                mediaRecorder.onstop = async function() {
                    await processRecording();
                };
                
                mediaRecorder.start();
                
                recordBtn.disabled = true;
                recordBtn.classList.add('recording');
                stopBtn.disabled = false;
                nextBtn.disabled = true;
                updateStatus('Recording...', 'recording');
            } catch (error) {
                alert('Error accessing microphone: ' + error.message);
                updateStatus('Error accessing microphone', 'idle');
                isRecording = false;
            }
        }
        
        async function processRecording() {
            if (audioChunks.length === 0) {
                updateStatus('No audio recorded', 'idle');
                return;
            }
            
            try {
                // Convert MediaRecorder blob to WAV
                const mimeType = mediaRecorder.mimeType || 'audio/webm';
                const audioBlob = new Blob(audioChunks, { type: mimeType });
                const arrayBuffer = await audioBlob.arrayBuffer();
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                
                // Convert to WAV
                const wavBuffer = encodeWAV(audioBuffer.getChannelData(0), audioBuffer.sampleRate);
                const wavBlob = new Blob([wavBuffer], { type: 'audio/wav' });
                
                const audioFileName = `audio_${String(currentIndex + 1).padStart(3, '0')}.wav`;
                const sentence = sentences[currentIndex];
                
                // Check if recording already exists for this sentence index
                const existingIndex = recordings.findIndex(r => r.sentenceIndex === currentIndex);
                if (existingIndex !== -1) {
                    // Replace existing recording
                    recordings[existingIndex] = {
                        fileName: audioFileName,
                        sentence: sentence,
                        blob: wavBlob,
                        sentenceIndex: currentIndex
                    };
                } else {
                    // Add new recording
                    recordings.push({
                        fileName: audioFileName,
                        sentence: sentence,
                        blob: wavBlob,
                        sentenceIndex: currentIndex
                    });
                }
                
                audioContext.close();
                
                recordBtn.disabled = false;
                recordBtn.classList.remove('recording');
                stopBtn.disabled = true;
                nextBtn.disabled = false;
                downloadBtn.disabled = false;
                
                updateStatus('Recording saved! Click "Next Sentence" to continue.', 'ready');
                updateRecordingsList();
                
                // Save to localStorage
                saveToLocalStorage();
            } catch (error) {
                console.error('Error processing recording:', error);
                alert('Error processing recording: ' + error.message);
                updateStatus('Error processing recording', 'idle');
                recordBtn.disabled = false;
                recordBtn.classList.remove('recording');
                stopBtn.disabled = true;
            }
        }

        function stopRecording() {
            if (!mediaRecorder || !isRecording) return;
            
            isRecording = false;
            mediaRecorder.stop();
            stream.getTracks().forEach(track => track.stop());
            stream = null;
        }

        function nextSentence() {
            if (currentIndex < sentences.length - 1) {
                currentIndex++;
                updateSentence();
                nextBtn.disabled = true;
                updateStatus('Ready to record', 'idle');
                // Save current index to localStorage
                saveToLocalStorage();
            } else {
                alert('All sentences completed! You can now download all recordings.');
            }
        }

        function playRecording(recordingIndex) {
            const rec = recordings[recordingIndex];
            if (!rec) return;
            
            const playBtn = document.querySelector(`.play-btn[data-index="${recordingIndex}"]`);
            
            // If this is already playing, stop it
            if (currentlyPlaying && currentlyPlaying.recordingIndex === recordingIndex) {
                currentlyPlaying.audio.pause();
                currentlyPlaying.audio.currentTime = 0;
                if (playBtn) {
                    playBtn.classList.remove('playing');
                    playBtn.textContent = '▶ Play';
                }
                URL.revokeObjectURL(currentlyPlaying.audio.src);
                currentlyPlaying = null;
                return;
            }
            
            // Stop currently playing audio if any
            if (currentlyPlaying) {
                currentlyPlaying.audio.pause();
                currentlyPlaying.audio.currentTime = 0;
                const prevBtn = document.querySelector(`.play-btn[data-index="${currentlyPlaying.recordingIndex}"]`);
                if (prevBtn) {
                    prevBtn.classList.remove('playing');
                    prevBtn.textContent = '▶ Play';
                }
                URL.revokeObjectURL(currentlyPlaying.audio.src);
            }
            
            // Create audio element and play
            const audio = new Audio(URL.createObjectURL(rec.blob));
            currentlyPlaying = { audio, recordingIndex };
            
            if (playBtn) {
                playBtn.classList.add('playing');
                playBtn.textContent = '⏸ Playing...';
            }
            
            audio.onended = () => {
                if (playBtn) {
                    playBtn.classList.remove('playing');
                    playBtn.textContent = '▶ Play';
                }
                URL.revokeObjectURL(audio.src);
                currentlyPlaying = null;
            };
            
            audio.onerror = () => {
                if (playBtn) {
                    playBtn.classList.remove('playing');
                    playBtn.textContent = '▶ Play';
                }
                alert('Error playing audio');
                currentlyPlaying = null;
            };
            
            audio.play();
        }
        
        function deleteRecording(recordingIndex) {
            const rec = recordings[recordingIndex];
            if (!rec) return;
            
            if (!confirm(`Delete recording for sentence ${rec.sentenceIndex + 1}? You can re-record it.`)) {
                return;
            }
            
            // Stop playing if this is the current audio
            if (currentlyPlaying && currentlyPlaying.recordingIndex === recordingIndex) {
                currentlyPlaying.audio.pause();
                URL.revokeObjectURL(currentlyPlaying.audio.src);
                currentlyPlaying = null;
            }
            
            // Remove from recordings array
            recordings.splice(recordingIndex, 1);
            
            // Navigate to that sentence for re-recording
            currentIndex = rec.sentenceIndex;
            updateSentence();
            nextBtn.disabled = true;
            updateStatus('Ready to re-record this sentence', 'idle');
            
            // Update the recordings list
            updateRecordingsList();
            
            // Update download button state
            downloadBtn.disabled = recordings.length === 0;
            
            // Save to localStorage
            saveToLocalStorage();
        }
        
        function updateRecordingsList() {
            if (recordings.length > 0) {
                recordingsList.style.display = 'block';
                // Sort recordings by sentence index
                const sortedRecordings = [...recordings].sort((a, b) => a.sentenceIndex - b.sentenceIndex);
                recordingsContainer.innerHTML = sortedRecordings.map((rec, idx) => {
                    const originalIndex = recordings.indexOf(rec);
                    return `
                    <div class="recording-item">
                        <div class="recording-info">
                            <div class="recording-name">${rec.fileName}</div>
                            <div class="recording-sentence">Sentence ${rec.sentenceIndex + 1}: ${rec.sentence}</div>
                        </div>
                        <div class="recording-actions">
                            <button class="action-btn play-btn" data-index="${originalIndex}" onclick="playRecording(${originalIndex})">▶ Play</button>
                            <button class="action-btn delete-btn" data-index="${originalIndex}" onclick="deleteRecording(${originalIndex})">🗑 Delete</button>
                        </div>
                    </div>
                `;
                }).join('');
            } else {
                recordingsList.style.display = 'none';
            }
        }

        function downloadFile(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        async function downloadAll() {
            if (recordings.length === 0) {
                alert('No recordings to download!');
                return;
            }

            updateStatus('Creating download package...', 'idle');
            downloadBtn.disabled = true;

            try {
                const zip = new JSZip();
                
                // Add all audio files to zip
                recordings.forEach(rec => {
                    zip.file(rec.fileName, rec.blob);
                });

                // Generate and add metadata.csv
                const csvContent = recordings.map(rec => 
                    `${rec.fileName}|${rec.sentence}`
                ).join('\n');
                zip.file('metadata.csv', csvContent);

                // Generate zip file
                const zipBlob = await zip.generateAsync({ type: 'blob' });
                downloadFile(zipBlob, 'piper_dataset.zip');
                
                updateStatus('Download complete!', 'ready');
            } catch (error) {
                alert('Error creating zip file: ' + error.message);
                updateStatus('Error creating download', 'idle');
            } finally {
                downloadBtn.disabled = false;
            }
        }

        // Make functions globally accessible for onclick handlers
        window.playRecording = playRecording;
        window.deleteRecording = deleteRecording;

        recordBtn.addEventListener('click', startRecording);
        stopBtn.addEventListener('click', stopRecording);
        nextBtn.addEventListener('click', nextSentence);
        downloadBtn.addEventListener('click', downloadAll);

        // Initialize - load from localStorage first
        loadFromLocalStorage();
        updateSentence();
        
        // Show message if data was loaded
        if (recordings.length > 0) {
            updateStatus(`Loaded ${recordings.length} previous recording(s). Continuing from sentence ${currentIndex + 1}.`, 'ready');
            setTimeout(() => {
                updateStatus('Ready to record', 'idle');
            }, 3000);
        }
    </script>
</body>
</html>
